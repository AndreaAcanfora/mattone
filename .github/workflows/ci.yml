name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # run (and deploy) by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tests/roms
          key: test-roms-${{ hashFiles('tests/fetch-roms.sh') }}
      - name: Fetch the test ROMs
        run: tests/fetch-roms.sh
      - name: Build
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Werror"
      - name: Test ROMs
        run: tests/run-tests.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test ROMs with AddressSanitizer and UBSan
        run: |
          make -B CC=${{ matrix.cc }} CFLAGS="-O1 -g -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"
          tests/run-tests.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk
        run: |
          curl -fsSL --retry 6 --retry-delay 10 -o wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar xzf wasi-sdk.tar.gz -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          rm wasi-sdk.tar.gz
      - name: Build the WebAssembly module
        run: WASI_SDK="$RUNNER_TEMP/wasi-sdk" scripts/build-web.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: tests/roms
          key: test-roms-${{ hashFiles('tests/fetch-roms.sh') }}
      - name: dmg-acid2 in the WebAssembly build matches the reference
        run: |
          tests/fetch-roms.sh
          node tests/wasm-test.mjs tests/roms/dmg-acid2.gb acid2-wasm.pgm
          python3 tests/compare.py acid2-wasm.pgm tests/roms/dmg-acid2.png
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web

  deploy:
    # Publishes the emulator to GitHub Pages from the default branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
